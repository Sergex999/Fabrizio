{% extends "base.html" %}
{% block content %}
<p>Copy the email below and send it to the customer.</p>
<textarea id="email_text" readonly>{{ email_text }}</textarea>
<button onclick="copyEmail()">Copy to Clipboard</button>
<a class="back" href="/">&larr; Start over</a>

<script>
function copyEmail() {
  const el = document.getElementById('email_text');
  el.select();
  navigator.clipboard.writeText(el.value);
}
</script>
{% endblock %}
