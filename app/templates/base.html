<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Cor Bloom Tracking Assistant</title>
  <style>
    body { font-family: -apple-system, Segoe UI, Arial, sans-serif; max-width: 1200px; margin: 40px auto; padding: 0 16px; color: #222; }
    h1 { font-size: 1.4rem; }
    h2 { font-size: 1.1rem; margin-top: 0; }
    label { display: block; margin-top: 12px; font-weight: 600; }
    input[type=text], input[type=email], textarea {
      width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box;
      font-family: inherit; font-size: 1rem; border: 1px solid #ccc; border-radius: 4px;
    }
    textarea { min-height: 320px; }
    button { margin-top: 20px; padding: 10px 18px; font-size: 1rem; cursor: pointer; }
    .warning { background: #fff8e1; border: 1px solid #f0c36d; padding: 10px 14px; border-radius: 4px; margin-top: 12px; }
    .warning ul { margin: 4px 0 0 18px; padding: 0; }
    .notes { background: #e8f4fd; border: 1px solid #a9d3f0; padding: 10px 14px; border-radius: 4px; margin-top: 12px; }
    a.back { display: inline-block; margin-top: 16px; }
    .panes { display: flex; gap: 24px; align-items: flex-start; }
    .pane { flex: 1; min-width: 0; }
    .placeholder { color: #888; font-style: italic; margin-top: 12px; }
  </style>
</head>
<body>
  <h1>Cor Bloom Jewelry — Tracking Assistant</h1>
  {% block content %}{% endblock %}
</body>
</html>
